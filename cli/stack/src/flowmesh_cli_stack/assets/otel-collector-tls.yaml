# TLS for the Collector's OTLP receivers, layered over otel-collector-config.yaml when the
# stack has server TLS material. It serves the server's gRPC certificate and key, which
# flowmesh stack mounts alone, so a producer verifies the Collector with the server CA.

receivers:
  otlp:
    protocols:
      grpc:
        tls:
          cert_file: /etc/otelcol-contrib/tls/server.pem
          key_file: /etc/otelcol-contrib/tls/server.key
      http:
        tls:
          cert_file: /etc/otelcol-contrib/tls/server.pem
          key_file: /etc/otelcol-contrib/tls/server.key
