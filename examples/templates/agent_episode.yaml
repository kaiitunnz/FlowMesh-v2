apiVersion: flowmesh/v2
kind: AgentTask
metadata:
  name: agent-episode
  owner: researcher
  annotations:
    description: >-
      The canonical agent example: the Codex app-server harness driving a real
      agent turn, whose model turns egress on the agent's own worker through the
      worker-local Responses facade to model_binding.url. Bound to a GPU-free
      dev_model endpoint for a deterministic run; serve a dev_model task first and
      set model_binding.url to its published endpoint.

spec:
  taskType: agent

  task: Say hello

  v2:
    authority: { invoke: [model], delegate: [] }
    tools: [{ name: model }]
    boundary: [invocation, yield]

  harness:
    backend: codex
    version: v1

  model_binding:
    mode: openai
    url: http://DEV_MODEL_HOST:PORT/v1
    model: dev-model
    api_key: "REPLACE_WITH_YOUR_DEV_MODEL_KEY"

  resources:
    hardware:
      cpu: 2
      memory: 4Gi
      gpu:
        type: any
        count: 0

  output:
    destination:
      type: local
    artifacts:
      - results.json
