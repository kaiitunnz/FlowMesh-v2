apiVersion: flowmesh/v2
kind: AgentTask
metadata:
  name: agent-episode
  owner: researcher
  annotations:
    description: >-
      Agent driven by the Codex app-server harness with a credential-free canned
      model binding. Codex runs a real agent turn; its model calls route through
      the FlowMesh agent-model gateway, which settles the boundary deterministically
      with no GPU and no external provider. Point harness.params.base_url at your
      FlowMesh server's agent-model gateway.

spec:
  taskType: agent

  task: Say hello

  v2:
    authority: { invoke: [model], delegate: [] }
    tools: [{ name: model }]
    boundary: [invocation, yield]

  harness:
    backend: codex
    version: v1
    params:
      base_url: http://FLOWMESH_GATEWAY_HOST:PORT
      model: gpt-4o-mini

  model_binding:
    mode: canned

  resources:
    hardware:
      cpu: 2
      memory: 4Gi
      gpu:
        type: any
        count: 0

  output:
    destination:
      type: local
    artifacts:
      - results.json
      - agent_output.txt
