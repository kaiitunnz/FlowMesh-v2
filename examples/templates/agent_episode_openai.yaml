apiVersion: flowmesh/v2
kind: AgentTask
metadata:
  name: agent-episode-openai
  owner: researcher
  annotations:
    description: >-
      Codex-harness agent bound to an external OpenAI-compatible model. Codex runs
      a real agent turn; its model calls route through the FlowMesh agent-model
      gateway, which forwards to model_binding.url with the workflow's own inline
      api_key (vaulted server-side at submission). Fill model_binding url/model/
      api_key with your provider's values; point harness.params.base_url at your
      FlowMesh agent-model gateway.

spec:
  taskType: agent

  task: Summarize the latest trends in artificial intelligence in three bullet points

  v2:
    authority: { invoke: [model], delegate: [] }
    tools: [{ name: model }]
    boundary: [invocation, yield]

  harness:
    backend: codex
    version: v1
    params:
      base_url: http://FLOWMESH_GATEWAY_HOST:PORT
      model: gpt-4o-mini

  model_binding:
    mode: openai
    url: https://api.openai.com/v1
    model: gpt-4o-mini
    api_key: "REPLACE_WITH_YOUR_OPENAI_KEY"

  resources:
    hardware:
      cpu: 2
      memory: 4Gi
      gpu:
        type: any
        count: 0

  output:
    destination:
      type: local
    artifacts:
      - results.json
      - agent_output.txt
