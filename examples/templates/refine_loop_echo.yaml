# refine_loop_echo.yaml
#
# A loop and a branch with the EchoExecutor (CPU-only):
# - seed emits "again"; the loop carries its first item into its body
# - each iteration's step echoes the carried value, then "done"; judge routes on
#   the first item, feeding the second back for the next iteration or exiting
# - the loop runs twice, and consume reads the value it exits with

apiVersion: flowmesh/v2
kind: Workflow
metadata:
  name: refine-loop-echo
  annotations:
    description: A two-iteration loop whose exit value a root task reads

spec:
  graph:
    templates:
      - name: refine_body
        inputs: [{ name: state, role: carried }]
        nodes:
          - name: step
            dependsOn: [{ node: $ingress, port: state, input: state }]
            spec:
              taskType: echo
              data: { type: list, items: ["${state.output}", "done"] }
          - name: judge
            dependsOn: [{ node: step, input: input }]
            region:
              kind: branch
              inputs: [{ name: input }]
              outputs: [{ name: again }, { name: done }]
              selection: { input: input, field: [items, 0, output] }
        edges:
          - from: { node: judge, port: again }
            to: { node: $feedback, port: state }
            project: [items, 1]
          - from: { node: judge, port: done }
            to: { node: $egress, port: state }
    nodes:
      - name: seed
        spec:
          taskType: echo
          data: { type: list, items: [again] }
      - name: refine
        dependsOn: [{ node: seed, input: state, project: [items, 0] }]
        region:
          kind: loop
          body_ref: refine_body
          carried: [{ name: state }]
      - name: consume
        dependsOn: [{ node: refine, port: state, input: final }]
        spec:
          taskType: echo
          data: { type: list, items: ["final: ${final.items.0.output}"] }
