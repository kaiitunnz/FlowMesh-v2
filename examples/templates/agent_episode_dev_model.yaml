apiVersion: flowmesh/v2
kind: AgentTask
metadata:
  name: agent-episode-dev-model
  owner: researcher
  annotations:
    description: >-
      Codex-harness agent whose model boundary fronts a GPU-free dev_model serve
      task. Codex runs a real agent turn; its model turns egress on the agent's own
      worker through the worker-local Responses facade to model_binding.url. Run a
      dev_model serve task first and set model_binding.url to its published
      endpoint.

spec:
  taskType: agent

  task: Summarize the latest trends in artificial intelligence in three bullet points

  v2:
    authority: { invoke: [model], delegate: [] }
    tools: [{ name: model }]
    boundary: [invocation, yield]

  harness:
    backend: codex
    version: v1

  model_binding:
    mode: openai
    url: http://DEV_MODEL_HOST:PORT/v1
    model: dev-model
    api_key: "REPLACE_WITH_YOUR_DEV_MODEL_KEY"

  resources:
    hardware:
      cpu: 2
      memory: 4Gi
      gpu:
        type: any
        count: 0

  output:
    destination:
      type: local
    artifacts:
      - results.json
