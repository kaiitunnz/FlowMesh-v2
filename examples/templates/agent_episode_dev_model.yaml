apiVersion: flowmesh/v2
kind: AgentTask
metadata:
  name: agent-episode-dev-model
  owner: researcher
  annotations:
    description: >-
      Agent episode whose model binding fronts a GPU-free dev_model serve task.
      The openai upstream url points at the dev_model endpoint, so the mediated
      model boundary settles against a local serving worker with no GPU. Run a
      dev_model serve task first and set the url to its published endpoint.

spec:
  taskType: agent

  task: Summarize the latest trends in artificial intelligence in three bullet points

  v2:
    authority: { invoke: [model], delegate: [] }
    tools: [{ name: model }]
    boundary: [invocation, yield]

  harness:
    backend: scripted
    version: v1
    params:
      script:
        - {op: boundary, kind: invocation, call: c0, interface: model, payload: "summarize"}
        - {op: complete, value_from: c0}

  model_binding:
    mode: openai
    url: http://127.0.0.1:8190/v1
    model: dev-model
    api_key: "REPLACE_WITH_YOUR_DEV_MODEL_KEY"

  resources:
    hardware:
      cpu: 1
      memory: 256Mi
      gpu:
        type: any
        count: 0

  output:
    destination:
      type: local
    artifacts:
      - results.json
      - agent_output.txt
