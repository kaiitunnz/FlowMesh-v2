apiVersion: flowmesh/v1
kind: ServeTask
metadata:
  name: serve-vllm-qwen
  annotations:
    description: Serve a Qwen3-0.6B model using vLLM.

spec:
  taskType: serve
  
  resources:
    hardware:
      cpu: 8
      memory: 32Gi
      gpu:
        type: any
        count: 1

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-0.6B
      revision: main
    vllm:
      gpu_memory_utilization: 0.9
      trust_remote_code: true
      max_model_len: 4096

  # A serve task is reached only through the FlowMesh-authenticated, claim-gated
  # task-ID route: POST /api/v1/serve/tasks/<task_id>/v1/chat/completions with a
  # FlowMesh credential and TASK read access. The worker binds the engine to
  # loopback and never exposes a raw listener or engine key.

  # Task TTL (seconds): the executor tears down the endpoint on expiry.
  ttlSeconds: 3600
