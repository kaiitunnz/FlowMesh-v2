apiVersion: flowmesh/v1
kind: ServeTask
metadata:
  name: serve-vllm-qwen
  annotations:
    description: Serve a Qwen3-0.6B model using vLLM.

spec:
  taskType: serve
  
  resources:
    hardware:
      cpu: 8
      memory: 32Gi
      gpu:
        type: any
        count: 1

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-0.6B
      revision: main
    vllm:
      gpu_memory_utilization: 0.9
      trust_remote_code: true
      max_model_len: 4096

  # Reach this task by its ID over the FlowMesh-authenticated, claim-gated route:
  # POST /api/v1/serve/tasks/<task_id>/v1/chat/completions with a FlowMesh credential
  # and TASK read access. Point an OpenAI SDK at that path — the request and the
  # engine's own response envelope relay through, a stream: true body included. The
  # worker binds the engine to loopback behind the task's claim-gated sidecar.

  # Task TTL (seconds): the executor tears down the endpoint on expiry.
  ttlSeconds: 3600
