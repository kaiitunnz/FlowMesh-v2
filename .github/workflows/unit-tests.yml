name: Unit Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # The telemetry store's queries are generated SQL over a schema the collector
    # creates, so asserting their shape catches a typo and not a wrong answer. They run
    # against the real engine, pinned to the version the stack deploys.
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
        env:
          CLICKHOUSE_PASSWORD: flowmesh
        ports:
          - 8123:8123
        options: >-
          --health-cmd "wget --spider -q http://localhost:8123/ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      # The worker status fence lives in Redis scripts, so its tests run them for real.
      redis:
        image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FLOWMESH_TEST_CLICKHOUSE_URL: http://127.0.0.1:8123
      FLOWMESH_TEST_CLICKHOUSE_PASSWORD: flowmesh
      FLOWMESH_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --all-packages --group ci --frozen

      # The collector refuses a malformed OTTL statement at startup, so a config that
      # only looks right takes the whole telemetry deployment down and nothing reaches
      # the store. Its own validator is the only thing that reads these the way it does.
      - name: Validate the collector config
        run: >
          docker run --rm
          -e TELEMETRY_CLICKHOUSE_DSN=clickhouse://localhost:9000
          -e TELEMETRY_CLICKHOUSE_DATABASE=flowmesh
          -e TELEMETRY_CLICKHOUSE_USERNAME=default
          -e TELEMETRY_CLICKHOUSE_PASSWORD=flowmesh
          -v "$GITHUB_WORKSPACE/cli/stack/src/flowmesh_cli_stack/assets/otel-collector-config.yaml:/cfg.yaml:ro"
          otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
          validate --config=/cfg.yaml

      - name: Run unit tests
        # Skip the multiprocessing GPU-cleanup test — it's too costly to
        # run on every PR (vllm engine startup + multi-process cleanup).
        run: >
          uv run pytest tests/
          --ignore=tests/worker/test_mp_executor_cleanup_gpu.py
          -v
