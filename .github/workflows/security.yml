name: security

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# RUNNER LANES — `push` to `main` may use the `nus-flowmesh` ARC scale set when
# `vars.NUS_RUNNERS == 'on'`; fork PRs stay GitHub-hosted. Rationale: CONTRIBUTING.md § CI runners.
jobs:
  zizmor:
    name: Zizmor (workflow audit)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-flowmesh' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.26"
      - name: Run zizmor
        # Persona is ``auditor`` — the strictest level.
        run: uvx --from zizmor==1.26.1 zizmor --persona auditor --format github .github/workflows

  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-flowmesh' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gitleaks scans the full git history for secrets; needs the
          # repo's commit graph, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        # Binary, not gitleaks-action — the action gates on a paid license for org repos.
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner

  bandit:
    name: Bandit (Python source audit)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-flowmesh' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.26"
      - name: Run bandit
        run: uvx bandit==1.9.4 -c pyproject.toml -r src/

  pip-audit:
    name: pip-audit (dependency CVE scan)
    runs-on: ${{ github.event_name == 'push' && vars.NUS_RUNNERS == 'on' && 'nus-flowmesh' || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
        with:
          version: "0.11.26"
      - name: Run pip-audit (server)
        # The constraints pin the packages the server image takes from uv.lock.
        run: |
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps \
            -r src/server/constraints.txt
      - name: Run pip-audit (worker)
        # The constraints pin the packages the worker images take from uv.lock; the GPU
        # delta run covers those the CUDA image resolves for itself.
        run: |
          uvx pip-audit==2.10.1 --strict --disable-pip --no-deps \
            --ignore-vuln PYSEC-2026-3740 \
            --ignore-vuln PYSEC-2026-3804 \
            -r src/worker/requirements/constraints.txt
      - name: Run pip-audit (image-resolved packages)
        # The packages the constraints leave for each image to resolve, at the
        # versions its build resolves them to.
        run: |
          audit_resolved() {  # audit_resolved <image> <requirements dir> [compile args]
            local image="$1" dir="$2"
            shift 2
            uv pip compile "$dir/requirements.txt" -c "$dir/constraints.txt" "$@" \
              --python-version 3.12 --python-platform x86_64-manylinux_2_28 \
              --no-header --no-annotate -q -o "$RUNNER_TEMP/$image-resolved.txt"
            uv run --no-project python scripts/dev/sync_requirements.py \
              --excluded "$image" "$RUNNER_TEMP/$image-resolved.txt" \
              > "$RUNNER_TEMP/$image-excluded.txt"
            echo "$image resolves: $(paste -sd' ' "$RUNNER_TEMP/$image-excluded.txt")"
            uvx pip-audit==2.10.1 --strict --disable-pip --no-deps \
              -r "$RUNNER_TEMP/$image-excluded.txt"
          }
          audit_resolved server src/server
          audit_resolved worker src/worker/requirements --torch-backend cpu
      - name: Run pip-audit (worker GPU delta)  # no --strict: flashinfer-jit-cache and the vllm +cu129 wheel are unauditable on PyPI
        run: |
          uvx pip-audit==2.10.1 \
            --ignore-vuln PYSEC-2026-3447 \
            --ignore-vuln PYSEC-2026-3740 \
            --ignore-vuln PYSEC-2026-3804 \
            -r src/worker/requirements/requirements.gpu.txt
